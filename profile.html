<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="./src/script.js"></script>
    <link rel="stylesheet" href="./style.css" />
    <script
      src="https://kit.fontawesome.com/b5a5784c82.js"
      crossorigin="anonymous"
    ></script>
    <title>The social</title>
  </head>
  <body>
    <header>
      <a href="./index.html" id="logo">The social</a>
      <div id="search">
        <input type="search" placeholder="Search..." />
      </div>
      <nav>
        <a href="profile.html" class="nav-item">
          <i class="fa-solid fa-user"></i>
          <span>Profile</span>
        </a>
      </nav>
    </header>
    <div class="toast-message hidden"></div>
    <div class="edit-post-modal hidden">
      <div class="edit-post-form">
        <h2>Edit post</h2>
        <form id="edit-post">
          <div class="edit">
            <label for="edit-post-title">Edit title:</label>
            <input type="text" name="edit-post-title" id="edit-post-title" />
          </div>

          <div class="edit">
            <label for="edit-post-message">Edit message:</label>
            <textarea
              name="edit-post-message"
              id="edit-post-message"
            ></textarea>
          </div>
          <div class="buttons-container">
            <button class="edit-btn" id="cancel-edit-post-btn">Cancel</button>
            <button class="edit-btn" id="edit-post-btn">Confirm</button>
          </div>
        </form>
      </div>
    </div>
    <main id="profile">
      <div class="profile-container">
        <div class="user-img-info">
          <div class="circle"></div>
          <div class="user-info">
            <span id="username">John5Post</span>
            <div class="follow-count">
              <div class="follow">
                <span>Following</span>
                <span id="following-count">8</span>
              </div>
              <div class="follow">
                <span>Followers</span>
                <span id="followers-count">2</span>
              </div>
            </div>
          </div>
        </div>
        <button>Edit porfile</button>
      </div>
      <h2>Posts</h2>
      <div class="user-posts-container" id="user-posts-container"></div>
    </main>
  </body>
</html>
