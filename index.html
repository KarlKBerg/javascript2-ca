<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="./src/script.js"></script>
    <link rel="stylesheet" href="./src/css/style.css" />
    <script
      src="https://kit.fontawesome.com/b5a5784c82.js"
      crossorigin="anonymous"
    ></script>
    <title>The social | Login</title>
  </head>
  <body class="bg-bcg-secondary flex h-screen flex-col text-white">
    <header class="bg-bcg-main flex items-center justify-between p-4">
      <a href="./index.html" id="logo" class="text-2xl">The social</a>
      <a
        href="./register.html"
        class="hover: cursor-pointer rounded-lg bg-blue-700 px-4 py-2 text-white hover:bg-blue-800"
        >Register</a
      >
    </header>
    <div class="toast-message hidden"></div>
    <main
      id="login"
      class="mx-auto flex w-full max-w-120 flex-1 items-center justify-center px-4"
    >
      <div
        class="bg-bcg-main flex w-full flex-col items-center gap-2 rounded-md p-4 px-4"
        id="login-container"
      >
        <h1 class="text-lg font-bold">Login</h1>
        <form id="login-form" class="flex w-full flex-col gap-4">
          <div class="flex flex-col gap-2">
            <label for="email"><b>Email</b></label>
            <input
              class="w-full rounded-md bg-white px-2 py-1 text-sm text-black outline-0"
              type="email"
              name="email"
              id="email"
              required
            />
          </div>

          <div class="flex flex-col gap-2">
            <label for="password"><b>Password</b></label>
            <input
              class="rounded-md bg-white px-2 py-1 text-sm text-black outline-0"
              type="password"
              name="password"
              id="password"
              required
            />
          </div>
          <button
            class="form-btn login-btn hover: cursor-pointer rounded-lg bg-green-700 px-4 py-2 text-white hover:bg-green-800"
          >
            Login
          </button>
          <p class="text-xs">
            Don't have an account yet?
            <a
              href="register.html"
              class="text-blue underline"
              id="register-txt"
              >Register here</a
            >
          </p>
        </form>
      </div>
    </main>
  </body>
</html>
