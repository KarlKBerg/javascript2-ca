<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="./src/script.js"></script>
    <link rel="stylesheet" href="./style.css" />
    <script
      src="https://kit.fontawesome.com/b5a5784c82.js"
      crossorigin="anonymous"
    ></script>
    <title>The social | Login</title>
  </head>
  <body>
    <header>
      <a href="./index.html" id="logo">The social</a>
      <a href="./register.html" class="form-btn register-btn">Register</a>
    </header>
    <main>
      <div class="form-container" id="login-container">
        <h1>Login</h1>
        <form>
          <div class="form-item-container">
            <label for="email"><b>Email</b></label>
            <input type="email" name="email" id="email" required />
          </div>

          <div class="form-item-container">
            <label for="password"><b>Password</b></label>
            <input type="password" name="password" id="password" required />
          </div>
          <button class="form-btn login-btn">Login</button>
          <p>
            Don't have an account yet?
            <a href="register.html" id="register-txt">Register here</a>
          </p>
        </form>
      </div>
    </main>
  </body>
</html>
