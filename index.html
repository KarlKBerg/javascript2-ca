<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="./src/script.js"></script>
    <link rel="stylesheet" href="./src/css/style.css" />
    <script
      src="https://kit.fontawesome.com/b5a5784c82.js"
      crossorigin="anonymous"
    ></script>
    <title>The social | Login</title>
  </head>
  <body class="bg-bcg-secondary text-white">
    <header class="flex justify-between items-center p-4 bg-bcg-main">
      <a href="./index.html" id="logo" class="text-2xl">The social</a>
      <a
        href="./register.html"
        class="px-4 py-2 bg-blue-700 text-white rounded-lg hover:bg-blue-800"
        >Register</a
      >
    </header>
    <div class="toast-message hidden"></div>
    <main id="login">
      <div class="form-container" id="login-container">
        <h1>Login</h1>
        <form id="login-form">
          <div class="form-item-container">
            <label for="email"><b>Email</b></label>
            <input type="email" name="email" id="email" required />
          </div>

          <div class="form-item-container">
            <label for="password"><b>Password</b></label>
            <input type="password" name="password" id="password" required />
          </div>
          <button class="form-btn login-btn">Login</button>
          <p>
            Don't have an account yet?
            <a href="register.html" id="register-txt">Register here</a>
          </p>
        </form>
      </div>
    </main>
  </body>
</html>
