<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="./src/script.js"></script>
    <link rel="stylesheet" href="./style.css" />
    <script
      src="https://kit.fontawesome.com/b5a5784c82.js"
      crossorigin="anonymous"
    ></script>
    <title>The social</title>
  </head>
  <body>
    <header>
      <a href="./index.html" id="logo">The social</a>
      <div id="search">
        <input type="search" placeholder="Search..." />
      </div>
      <nav>
        <a href="profile.html" class="nav-item">
          <i class="fa-solid fa-user"></i>
          <span>Profile</span>
        </a>
        <button class="form-btn" id="logout-btn">Logout</button>
      </nav>
    </header>
    <div class="toast-message hidden"></div>
    <main id="feed">
      <h1>Feed</h1>
      <div class="create-post">
        <h2>Create post</h2>
        <form id="create-post-form">
          <input
            type="text"
            name="post-title"
            id="post-title"
            placeholder="What would you like to say?"
            required
          />

          <textarea
            name="post-message"
            id="post-message"
            placeholder="What would you like to say?"
          ></textarea>

          <button class="form-btn" id="post-btn">Post</button>
        </form>
      </div>
      <div class="posts-container" id="posts-container"></div>
    </main>
  </body>
</html>
