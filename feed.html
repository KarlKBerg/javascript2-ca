<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="./src/script.js"></script>
    <link rel="stylesheet" href="./src/css/style.css" />
    <script
      src="https://kit.fontawesome.com/b5a5784c82.js"
      crossorigin="anonymous"
    ></script>
    <title>The social</title>
  </head>
  <body class="bg-bcg-secondary flex h-screen flex-col text-white">
    <header
      class="bg-bcg-main flex items-center justify-between p-4 md:p-6 lg:p-8"
    >
      <a href="./index.html" id="logo" class="text-2xl md:text-3xl lg:text-4xl"
        >The social</a
      >
      <div id="search">
        <input
          type="search"
          placeholder="Search..."
          class="searchfield hidden w-full min-w-90 rounded-md bg-white text-sm text-black outline-0 md:block md:px-2 md:text-lg"
        />
      </div>
      <nav class="hidden gap-4 md:flex">
        <a
          href="profile.html"
          class="flex flex-col items-center rounded-md p-1 hover:cursor-pointer"
          id="profile-link"
        >
          <i class="fa-solid fa-user"></i>
          <span>Profile</span>
        </a>
        <button
          class="logout-btn rounded-lg bg-red-700 px-4 py-2 text-white hover:cursor-pointer hover:bg-red-800"
        >
          Logout
        </button>
      </nav>
      <button id="hamburger-menu" class="md:hidden">
        <i class="fa-mosaic fa-solid fa-bars"></i>
      </button>
    </header>
    <div
      class="hidden flex-col justify-center gap-4 py-4 md:hidden"
      id="nav-mobile"
    >
      <button id="profile-btn">Profile</button>
      <button id="mobile-search-btn">Search</button>
      <button class="logout-btn rounded-lg bg-red-700 px-4 py-1 text-white">
        Logout
      </button>
    </div>
    <div id="mobile-search" class="hidden">
      <input
        type="search"
        placeholder="Search..."
        class="searchfield w-full rounded-md bg-white px-1 py-1 text-sm text-black outline-0"
      />
    </div>
    <div
      class="search-results fixed top-0 left-0 z-999 hidden w-screen bg-black/50"
    >
      <div
        class="fixed top-25 left-0.5 z-1001 flex h-screen translate-x-0.5 flex-col gap-1 overflow-y-auto rounded-md bg-white px-2 py-1"
        id="result-container"
      ></div>
    </div>
    <div class="toast-message hidden p-1 text-center"></div>
    <div class="fixed top-0 left-0 z-999 hidden h-screen w-screen bg-black/50">
      <div
        class="bg-bcg-secondary fixed top-0.5 left-0.5 z-1000 flex w-100 translate-x-1/5 translate-y-1/5 flex-col gap-2 rounded-md px-2 py-4"
      >
        <h2>Edit post</h2>
        <form class="flex flex-col gap-2">
          <div class="flex flex-col gap-1">
            <label for="edit-post-title">Edit title:</label>
            <input
              type="text"
              name="edit-post-title"
              id="edit-post-title"
              class="rounded-md bg-white px-1 py-1 text-black outline-0"
            />
          </div>

          <div class="flex flex-col gap-1">
            <label for="edit-post-message">Edit message:</label>
            <textarea
              name="edit-post-message"
              id="edit-post-message"
              class="rounded-md bg-white px-1 py-2 text-black outline-0"
            ></textarea>
          </div>
          <div class="buttons-container flex gap-1">
            <button
              class="edit-btn rounded-lg bg-red-700 px-4 py-1 text-white"
              id="cancel-edit-post-btn"
              type="button"
            >
              Cancel
            </button>
            <button
              class="edit-btn rounded-lg bg-green-700 px-4 py-1 text-white"
              id="edit-post-btn"
            >
              Confirm
            </button>
          </div>
        </form>
      </div>
    </div>
    <main id="feed" class="mx-auto flex w-full max-w-200 flex-col p-1 md:p-4">
      <h1 class="border-b-2 border-white pb-2 text-xl md:text-3xl lg:text-4xl">
        Feed
      </h1>
      <div
        class="create-post bg-bcg-main lg-p4 mt-2 flex w-full flex-col gap-2 rounded-md p-1 md:mt-4 md:gap-4 md:p-2 lg:mt-6"
      >
        <h2>Create post</h2>
        <form
          id="create-post-form"
          class="flex flex-col items-center gap-2 text-black md:gap-4"
        >
          <input
            class="w-full rounded-md bg-white p-1"
            type="text"
            name="post-title"
            id="post-title"
            placeholder="What would you like to say?"
            required
          />

          <textarea
            class="w-full resize-none rounded-md bg-white p-1"
            name="post-message"
            id="post-message"
            placeholder="What would you like to say?"
          ></textarea>

          <button
            class="form-btn bg-bcg-secondary self-end rounded-md border-2 border-white px-4 py-1 text-white hover:cursor-pointer hover:bg-green-800"
            id="post-btn"
          >
            Post
          </button>
        </form>
      </div>
      <div
        class="posts-container mt-2 flex flex-col gap-2 md:mt-4 md:gap-4 lg:mt-6 lg:gap-6"
        id="posts-container"
      ></div>
    </main>
  </body>
</html>
